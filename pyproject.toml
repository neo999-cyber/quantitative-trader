[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centaur-trader"
version = "0.1.0"
description = "The Centaur Method: AI quantitative screener + veteran trader rulebook + daily workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
centaur = "centaur.cli:main"

[tool.setuptools.packages.find]
include = ["centaur*"]

[tool.setuptools.package-data]
centaur = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
